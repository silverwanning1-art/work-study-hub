[project]
name = "action-invoice"
version = "0.1.0"
description = "Action plugin: create, issue and manage invoices for freelance projects"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "mcp>=2.2.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.3",
    "weasyprint>=70.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/action_invoice"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["weasyprint", "weasyprint.*"]
ignore_missing_imports = true  # WeasyPrint ships no type information

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
]
