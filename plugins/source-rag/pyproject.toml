[project]
name = "source-rag"
version = "0.1.0"
description = "Source plugin: MCP wrapper around the existing RAG server"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28.1", "mcp>=2.2.0"]

[dependency-groups]
dev = ["mypy>=2.4.0", "pytest>=9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
strict = true
files = ["server.py"]
