id: action-study
type: action
version: 0.1.0
description: Karteikarten mit Lernfortschritt (Spaced Repetition)
workspaces: [studium]
mcp:
  url: http://action-study:8000/mcp
tools:
  - name: list_decks
  - name: list_cards
  - name: get_due_cards
  - name: get_stats
  # Only updates the personal learning state in this plugin's own database and is not in any
  # agent allowlist, so it needs no confirmation per card (ADR-004).
  - name: rate_card
  - name: save_cards
    writes: true
    requires_confirmation: true
  - name: delete_deck
    writes: true
    requires_confirmation: true
secrets: []
