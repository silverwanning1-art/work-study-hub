[project]
name = "source-vault"
version = "0.1.0"
description = "Source plugin: read-only MCP server for an Obsidian vault"
requires-python = ">=3.12"
dependencies = ["mcp>=2.2.0"]

[dependency-groups]
dev = ["mypy>=2.4.0", "pytest>=9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
strict = true
files = ["server.py"]
