# Only Caddy publishes a port, and only on 127.0.0.1.
# The RAG server and other host services keep their ports (5173, 5174, 5678, 8000, 8002, 8080, 8765).
services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HUB_HTTP_PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - core
      - frontend

  core:
    build: .
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Optional: without a key the agent chat answers 503. Never commit the real value.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./plugins:/app/plugins:ro
      - ./agents:/app/agents:ro
    depends_on:
      - source-hello
      - source-rag
      - source-vault
      - action-invoice
      - action-study

  frontend:
    build: ./frontend
    restart: unless-stopped

  source-hello:
    build: ./plugins/source-hello
    restart: unless-stopped

  source-rag:
    build: ./plugins/source-rag
    restart: unless-stopped
    environment:
      # The RAG server runs on the host (launchd), not in this stack.
      RAG_URL: ${RAG_URL:-http://host.docker.internal:5678}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  source-vault:
    build: ./plugins/source-vault
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    environment:
      VAULT_PATH: /vault
      VAULT_NAME: ${VAULT_NAME:-WiIng-Vault}
    volumes:
      # ADR-003: the vault is mounted read-only; this plugin can never write to it.
      - ${VAULT_DIR:-${HOME}/rag_studium/WiIng-Vault}:/vault:ro

  action-invoice:
    build: ./plugins/action-invoice
    restart: unless-stopped
    environment:
      INVOICE_DB_PATH: /data/invoice.sqlite
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # Personal data (customers, invoices) lives only in this volume, never in the repo.
      - invoice-data:/data

  action-study:
    build: ./plugins/action-study
    restart: unless-stopped
    environment:
      STUDY_DB_PATH: /data/study.sqlite
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # Cards, progress and (later) exams live only in this volume, never in the repo.
      - study-data:/data

volumes:
  invoice-data:
  study-data:
