server {
    listen 8080;
    root /usr/share/nginx/html;
    absolute_redirect off;

    # SPA: unknown paths fall back to the shell.
    location / {
        # Prerendered pages are /name.html. No "$uri/": a directory match makes nginx redirect
        # to its own port (8080), which is wrong behind the proxy.
        try_files $uri $uri.html /index.html;
    }

    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
